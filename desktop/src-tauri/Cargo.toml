[package]
name = "andamio-desktop"
version = "0.2.0"
description = "andamio de escritorio: el panel de andamio en su propia ventana"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
sys-locale = "0.3"

[profile.release]
# Más chico: sin símbolos de depuración, una sola unidad de compilación.
strip = true
lto = true
codegen-units = 1
