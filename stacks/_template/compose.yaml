# Plantilla de stack. Copiar a stacks/<nombre>/ y ajustar.
services:
  servicio:
    image: imagen:1.2.3                # versión fija, nunca :latest
    container_name: servicio
    restart: unless-stopped
    env_file: .env                     # chmod 600, fuera de git
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy                          # y/o data, monitoring
    volumes:
      - servicio_data:/data            # datos
      - ./config/servicio.yml:/etc/servicio.yml:ro   # config versionada
    mem_limit: 256m
    memswap_limit: 256m                # = mem_limit: sin swap por contenedor
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  servicio_data:
