# Monitoreo en dos niveles (andamio_monitoring en Ansible):
#  - mínimo (~115 MiB): prometheus, node-exporter y cadvisor; métricas para el dashboard.
#  - completo (~670 MiB con Uptime Kuma): + loki, alloy y grafana (perfil "completo",
#    activado con COMPOSE_PROFILES en el .env). En mínimo, Prometheus ve a loki y alloy
#    como objetivos caídos: es esperado, no hay Grafana que alerte.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9091:9090"   # solo local: túnel SSH para desarrollo
    container_name: prometheus
    extra_hosts:
      - host.docker.internal:host-gateway   # node-exporter, que corre con la red del host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, host-access]   # host-access: sin ella no se puede publicar el puerto
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    # Red del host: dentro de una red de Docker solo vería el tráfico de su propio contenedor, no
    # el del servidor. Escucha solo en docker0 (172.17.0.1), nunca en la IP pública; Prometheus
    # llega por host.docker.internal y el firewall abre el 9100 solo a las redes de Docker.
    # (Con la red del host, el nombre que reporta ya es el del servidor: no hace falta hostname.)
    network_mode: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.17.0.1:9100
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile   # scripts/container-health.sh
      # Las interfaces virtuales de Docker y la VPN no son tráfico propio del servidor.
      - --collector.netdev.device-exclude=^(lo|veth.*|docker.*|br-.*|wg.*)$
    pid: host
    volumes:
      - /:/host:ro,rslave
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 50

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --docker=tcp://socket-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro   # necesario para nombrar contenedores (ver ADR 0009)
    networks: [monitoring, socket]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

  loki:
    profiles: [completo]     # nivel completo de monitoreo (andamio_monitoring)
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 200

  alloy:
    profiles: [completo]     # nivel completo de monitoreo (andamio_monitoring)
    image: grafana/alloy:v1.21.0
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks: [monitoring, socket]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

  grafana:
    profiles: [completo]     # nivel completo de monitoreo (andamio_monitoring)
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}          # usados por provisioning/alerting
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [proxy, monitoring]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.middlewares=vpn-only@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
  monitoring:
    external: true
  socket:
    external: true
    name: proxy_socket
  host-access: {}         # red no interna, solo Prometheus (para 127.0.0.1:9091)      # la red interna del stack proxy, donde está socket-proxy

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
