apiVersion: 1

groups:
  - orgId: 1
    name: homelab
    folder: Homelab
    interval: 1m
    rules:
      - uid: disk-high
        title: Disco por encima del 80%
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Disco del VPS al {{ printf "%.0f" .Values.A.Value }}%'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [80] } }]

      - uid: ram-high
        title: RAM del host por encima del 90%
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'RAM del VPS al {{ printf "%.0f" .Values.A.Value }}%'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [90] } }]

      - uid: container-mem-limit
        title: Contenedor cerca de su límite de memoria
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: '{{ index .Labels "name" }} usa el {{ printf "%.0f" .Values.A.Value }}% de su mem_limit (working set)'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (name) (100 * container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [90] } }]

      - uid: container-restarts
        title: Contenedor reiniciándose en bucle
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ index .Labels "name" }} se reinició {{ printf "%.0f" .Values.A.Value }} veces en 15 min'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (name) (changes(container_start_time_seconds{name!=""}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [3] } }]

      - uid: http-5xx
        title: Errores 5xx en una app
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ index .Labels "service" }}: {{ printf "%.1f" .Values.A.Value }}% de respuestas 5xx'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: |
                100 * sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                  / sum by (service) (rate(traefik_service_requests_total[5m]))
                and sum by (service) (rate(traefik_service_requests_total[5m])) > 0.1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [5] } }]

      - uid: target-down
        title: Exportador de métricas caído
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Prometheus no puede leer el job {{ index .Labels "job" }}'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: up
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # Todos los certificados que sirve Traefik. Let's Encrypt renueva a 30 días del
      # vencimiento: si llega a 20, la renovación lleva 10 días fallando. Un certificado
      # propio (homelab_tls: custom) se renueva a mano: bin/andamio certificado.
      - uid: cert-expiry
        title: Certificado HTTPS por vencer
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'El certificado de {{ index .Labels "cn" }} vence en {{ printf "%.0f" .Values.A.Value }} días'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: min by (cn) ((traefik_tls_certs_not_after - time()) / 86400)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [20] } }]
