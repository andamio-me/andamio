# Alertas de Grafana por Telegram. Ansible lo copia a provisioning/alerting/contact-points.yml
# SOLO si homelab_telegram está activado (con el token vacío, Grafana no arrancaría).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: ${TELEGRAM_TOKEN}
          chatid: "${TELEGRAM_CHAT_ID}"

policies:
  - orgId: 1
    receiver: telegram
    group_by: [grafana_folder, alertname]
    group_wait: 30s          # espera para agrupar alertas que llegan juntas
    group_interval: 5m
    repeat_interval: 4h      # si sigue activa, recordar cada 4 horas
