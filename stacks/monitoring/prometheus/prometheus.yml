global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    # node-exporter corre con la red del host (ve el tráfico real del servidor).
    static_configs: [{ targets: ["host.docker.internal:9100"] }]
    # La misma etiqueta instance de antes: la historia de las métricas sigue sin cortarse.
    relabel_configs:
      - target_label: instance
        replacement: node-exporter:9100
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8080"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
