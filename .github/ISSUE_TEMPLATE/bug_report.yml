name: Bug report
description: Something in andamio does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. **Si es una vulnerabilidad, no la pongas aquí** — sigue SECURITY.md (reporte privado).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead.
      placeholder: "`andamio ...` returned ... but I expected ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: andamio commit
      description: The commit you are on (`git -C your-copy rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Server provider and OS, and whether it's a fresh install or an update.
    validations:
      required: false
  - type: checkboxes
    id: not-security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability (those go private — see SECURITY.md).
          required: true
