name: Feature request
description: Suggest a change or a new capability for andamio.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Para cambios grandes o de infraestructura, abre el issue **antes** de escribir código y acordamos el enfoque.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that andamio makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should andamio do? How would it behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
    validations:
      required: false
