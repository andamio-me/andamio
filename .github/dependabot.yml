# Dependabot de homelab-infra: actions del CI y las imágenes fijadas de los stacks.
# Un PR semanal; cooldown de 7 días (no propone versiones recién publicadas).
# Mezclar un PR de imágenes NO despliega: se aplica con ./hl aplicar homelab.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/stacks/*"]
    # stacks/_template es un ejemplo (imagen "imagen"): no es una dependencia real.
    exclude-paths: ["stacks/_template/**"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Saltos mayores (PostgreSQL 18 -> 19, MariaDB 10 -> 11, ...) llevan migración: a mano.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
