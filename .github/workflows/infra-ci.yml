# CI de andamio: scripts, Ansible y secretos. Corre en cada push y PR a main.
# Las herramientas van fijadas por versión (y gitleaks verificado por checksum).
# Dónde corre: en el runner propio si el repo tiene la variable RUNNER=self-hosted
# (tools/runner.sh), si no en los de GitHub. Un cambio que solo toca docs no lo corre.
name: infra-ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

# Dos push seguidos: la corrida del primero ya no sirve.
concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Scripts (shellcheck)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          pipx install --force shellcheck-py==0.11.0.1
          shellcheck --version
          shellcheck -S warning scripts/*.sh bin/andamio-app ansible/hl tools/tests.sh tools/ui-build.sh tools/runner.sh tests/build-fixtures.sh

  # Los tests de andamio (tests/): update, Dockerfiles generados, revisión previa, andamio app.
  tests:
    name: Tests (pytest)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: pytest
        run: tools/tests.sh -v

  # El panel (andamio ui): tipos de Svelte/TypeScript, y que ui/ (lo que se sirve) sea
  # exactamente lo que compila ui-src/.
  panel:
    name: Panel (tipos y ui/ al día)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: compilar y comparar
        run: tools/ui-build.sh --check

  # Los Dockerfiles que genera andamio, construidos y arrancados de verdad (Node, Python, Go, estático).
  dockerfiles:
    name: Dockerfiles generados (build y arranque)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: build y arranque
        run: tests/build-fixtures.sh

  ansible-lint:
    name: Ansible (ansible-lint)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - name: ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          # --include-deps: también ansible-galaxy (de ansible-core). En los runners de GitHub
          # viene instalado; en uno propio, no. --force: en un runner propio pipx recuerda lo de
          # antes, y sin esto no cambiaría a la versión fijada.
          pipx install --force --include-deps ansible-lint==26.9.0
          ansible-galaxy collection install -r requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-lint --nocolor

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # todo el historial: un secreto borrado sigue en git
      - name: gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks git --no-banner --redact .
