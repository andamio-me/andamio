# Workflow reutilizable: check, build, escaneo y deploy de una app de andamio.
# Uso desde el repo de la app: .github/workflows/andamio.yml (lo escribe `andamio app create`).
# Las apps lo fijan por SHA (tag app-build-vN). Runner: ubuntu-24.04 (cambiar de Ubuntu es una
# decisión, no algo que pase solo con ubuntu-latest), o el propio si la app pasa
# runner: self-hosted (tools/runner.sh; solo repos privados).
name: app-build

on:
  workflow_call:
    inputs:
      runner:
        description: Dónde corre (ubuntu-24.04, o self-hosted con un runner propio de tools/runner.sh)
        type: string
        default: ubuntu-24.04
      image:
        description: Nombre de la imagen en GHCR (p. ej. mi-app)
        required: true
        type: string
      target:
        description: Etapa del Dockerfile que se despliega (vacío = la última)
        type: string
        default: ""
      build_secrets:
        description: >-
          Secretos de Actions que el Dockerfile recibe al construir, separados por espacio
          (p. ej. "NPM_TOKEN SENTRY_AUTH_TOKEN"). En el Dockerfile:
          RUN --mount=type=secret,id=NPM_TOKEN ... (quedan fuera de la imagen). Llegan en
          ANDAMIO_SECRETS (o con "secrets: inherit"). Los de ejecución van con andamio app secret.
        type: string
        default: ""
      dir:
        description: >-
          Carpeta de la app dentro del repo, donde está su Dockerfile (vacío = la raíz). Para
          varias apps en un repo (p. ej. frontend/ y backend/).
        type: string
        default: ""
      context:
        description: Desde dónde se construye la imagen (vacío = dir). "." si usa archivos compartidos de la raíz
        type: string
        default: ""
      deploy_key:
        description: Nombre del secreto con la llave de deploy (varias apps en un repo, una por app)
        type: string
        default: DEPLOY_SSH_KEY
      migrate:
        description: Construir también la imagen de migraciones (target "migrate")
        type: boolean
        default: false
      deploy:
        description: Desplegar en el VPS después del build (solo en push)
        type: boolean
        default: false
      # A dónde desplegar: variables de Actions DEPLOY_* del repo de la app (las fija
      # `andamio app create`). Obligatorias si deploy es true.
      deploy_host:
        description: IP o nombre del servidor (vars.DEPLOY_HOST)
        type: string
        default: ""
      deploy_port:
        description: Puerto SSH del servidor (vars.DEPLOY_PORT)
        type: string
        default: "22"
      deploy_user:
        description: Usuario de operación en el servidor (vars.DEPLOY_USER)
        type: string
        default: ""
      deploy_known_hosts:
        description: Línea de known_hosts con la llave de host verificada (vars.DEPLOY_KNOWN_HOSTS)
        type: string
        default: ""
    secrets:
      DEPLOY_SSH_KEY:
        description: Llave SSH de deploy de la app (forced command en el VPS)
        required: false
      # "secrets: inherit" solo funciona entre repos del mismo dueño: una app de otra cuenta
      # que usa este workflow público le pasa sus secretos aquí, como toJSON(secrets). Fijado
      # por SHA, el workflow recibe lo mismo que con inherit; de aquí salen la llave de deploy
      # (deploy_key) y los de build_secrets.
      ANDAMIO_SECRETS:
        description: Los secretos de Actions del repo de la app, en JSON (toJSON(secrets))
        required: false
    outputs:
      tag:
        description: Tag de la imagen publicada (hash del commit)
        value: ${{ jobs.build.outputs.tag }}

env:
  # Escáner de vulnerabilidades, fijado por digest (un tag se puede mover).
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  # Revisión, sea cual sea el lenguaje de la app:
  #  - siempre: secretos (gitleaks);
  #  - si el Dockerfile tiene una etapa "test": se construye, y si falla no se despliega
  #    (los tests corren en la imagen, con las herramientas del lenguaje de la app);
  #  - si es un proyecto pnpm (pnpm-lock.yaml): lint, typecheck y test de package.json.
  check:
    name: Revisión
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial
      # Varias apps en un repo (front y back): cada una en su carpeta (dir), con su Dockerfile.
      # context: desde dónde se construye (la raíz si usa archivos compartidos). Vacíos = la raíz.
      - name: Carpeta de la app
        id: where
        env:
          DIR: ${{ inputs.dir }}
          CONTEXT: ${{ inputs.context }}
        run: |
          for v in "$DIR" "$CONTEXT"; do
            if [[ ! $v =~ ^[A-Za-z0-9._/-]*$ || $v == *..* || $v == /* ]]; then
              echo "::error::Carpeta inválida: $v (relativa al repo, sin ..)"; exit 1
            fi
          done
          dir=${DIR%/}; dir=${dir:-.}
          ctx=${CONTEXT%/}; ctx=${ctx:-$dir}
          [ -f "$dir/Dockerfile" ] || { echo "::error title=Falta el Dockerfile::No hay $dir/Dockerfile en el repo"; exit 1; }
          { echo "dir=$dir"; echo "context=$ctx"; echo "dockerfile=$dir/Dockerfile"; } >> "$GITHUB_OUTPUT"
      - name: Secretos (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP" gitleaks && rm "$f"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

      # Secretos de build: cada uno a un archivo privado del runner, que BuildKit monta solo
      # en el RUN que lo pide (nunca queda en una capa de la imagen). Los valores siguen
      # enmascarados en los logs.
      - name: Secretos de build
        id: bs
        if: inputs.build_secrets != ''
        env:
          NAMES: ${{ inputs.build_secrets }}
          ALL: ${{ secrets.ANDAMIO_SECRETS || toJSON(secrets) }}
        run: |
          d="$RUNNER_TEMP/build-secrets"; install -m 700 -d "$d"
          files=""; flags=""
          for n in $NAMES; do
            [[ $n =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error::Nombre de secreto de build inválido: $n"; exit 1; }
            v=$(jq -r --arg n "$n" '.[$n] // empty' <<< "$ALL")
            if [ -z "$v" ]; then
              echo "::error title=Falta el secreto $n::Agrégalo en el repo de la app (Settings → Secrets and variables → Actions); su workflow lo pasa con ANDAMIO_SECRETS."
              exit 1
            fi
            printf '%s' "$v" > "$d/$n"
            files+="$n=$d/$n"$'\n'; flags+=" --secret id=$n,src=$d/$n"
          done
          { echo "files<<EOF"; printf '%s' "$files"; echo "EOF"; echo "flags=$flags"; } >> "$GITHUB_OUTPUT"

      - name: Etapa "test" del Dockerfile (cualquier lenguaje)
        env:
          SECRET_FLAGS: ${{ steps.bs.outputs.flags }}
          DOCKERFILE: ${{ steps.where.outputs.dockerfile }}
          CONTEXT: ${{ steps.where.outputs.context }}
        run: |
          if grep -qiE '^[[:space:]]*FROM[[:space:]].+[[:space:]]AS[[:space:]]+test[[:space:]]*$' "$DOCKERFILE"; then
            # shellcheck disable=SC2086   # SECRET_FLAGS son varios argumentos a propósito
            DOCKER_BUILDKIT=1 docker build --target test --progress plain --build-arg GIT_SHA="$GITHUB_SHA" $SECRET_FLAGS -f "$DOCKERFILE" "$CONTEXT"
          else
            echo "El Dockerfile no tiene etapa \"test\": sin tests en imagen."
          fi

      # pnpm: el de la carpeta de la app (o el de la raíz si la app está en la raíz). Node va antes:
      # su instalador necesita Node 20+, y un runner propio puede traer uno viejo (Ubuntu: 18). La
      # caché de pnpm va en el segundo setup-node, que necesita pnpm ya instalado.
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm
        if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ steps.where.outputs.dir }}/package.json
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ steps.where.outputs.dir }}/pnpm-lock.yaml
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        working-directory: ${{ steps.where.outputs.dir }}
        run: pnpm install --frozen-lockfile
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        working-directory: ${{ steps.where.outputs.dir }}
        run: pnpm run --if-present lint
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        working-directory: ${{ steps.where.outputs.dir }}
        run: pnpm run --if-present typecheck
      - if: hashFiles(format('{0}/pnpm-lock.yaml', steps.where.outputs.dir)) != ''
        working-directory: ${{ steps.where.outputs.dir }}
        run: pnpm run --if-present test

  # Corre a la vez que la revisión (antes la esperaba): los tests no frenan el build, frenan el
  # deploy (needs: [check, build]). Lo que frena publicar sigue aquí: secretos y vulnerabilidades.
  build:
    name: Construir y publicar imágenes
    if: github.event_name == 'push'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial antes de publicar una imagen
      # Varias apps en un repo (front y back): cada una en su carpeta (dir), con su Dockerfile.
      # context: desde dónde se construye (la raíz si usa archivos compartidos). Vacíos = la raíz.
      - name: Carpeta de la app
        id: where
        env:
          DIR: ${{ inputs.dir }}
          CONTEXT: ${{ inputs.context }}
        run: |
          for v in "$DIR" "$CONTEXT"; do
            if [[ ! $v =~ ^[A-Za-z0-9._/-]*$ || $v == *..* || $v == /* ]]; then
              echo "::error::Carpeta inválida: $v (relativa al repo, sin ..)"; exit 1
            fi
          done
          dir=${DIR%/}; dir=${dir:-.}
          ctx=${CONTEXT%/}; ctx=${ctx:-$dir}
          [ -f "$dir/Dockerfile" ] || { echo "::error title=Falta el Dockerfile::No hay $dir/Dockerfile en el repo"; exit 1; }
          { echo "dir=$dir"; echo "context=$ctx"; echo "dockerfile=$dir/Dockerfile"; } >> "$GITHUB_OUTPUT"
      - name: Secretos (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP" gitleaks && rm "$f"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

      - name: Nombres y tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR exige minúsculas
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Secretos de build: cada uno a un archivo privado del runner, que BuildKit monta solo
      # en el RUN que lo pide (nunca queda en una capa de la imagen). Los valores siguen
      # enmascarados en los logs.
      - name: Secretos de build
        id: bs
        if: inputs.build_secrets != ''
        env:
          NAMES: ${{ inputs.build_secrets }}
          ALL: ${{ secrets.ANDAMIO_SECRETS || toJSON(secrets) }}
        run: |
          d="$RUNNER_TEMP/build-secrets"; install -m 700 -d "$d"
          files=""; flags=""
          for n in $NAMES; do
            [[ $n =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error::Nombre de secreto de build inválido: $n"; exit 1; }
            v=$(jq -r --arg n "$n" '.[$n] // empty' <<< "$ALL")
            if [ -z "$v" ]; then
              echo "::error title=Falta el secreto $n::Agrégalo en el repo de la app (Settings → Secrets and variables → Actions); su workflow lo pasa con ANDAMIO_SECRETS."
              exit 1
            fi
            printf '%s' "$v" > "$d/$n"
            files+="$n=$d/$n"$'\n'; flags+=" --secret id=$n,src=$d/$n"
          done
          { echo "files<<EOF"; printf '%s' "$files"; echo "EOF"; echo "flags=$flags"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La imagen se construye SIN publicar, Trivy la revisa y solo si pasa se sube a
      # GHCR: una imagen con vulnerabilidades graves y con arreglo nunca llega al
      # registro ni al servidor.
      # GIT_SHA: el commit que se construye. Un Dockerfile que lo declare (ARG GIT_SHA) antes
      # de un paso que baja algo de afuera (git clone, curl) lo repite en cada deploy en vez
      # de reusarlo del caché. Si no lo declara, no cambia nada.
      - name: Imagen de la app (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.where.outputs.context }}
          file: ${{ steps.where.outputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: GIT_SHA=${{ github.sha }}
          secret-files: ${{ steps.bs.outputs.files }}
          load: true
          tags: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      # La base de vulnerabilidades de Trivy, guardada entre corridas (se renueva a diario): bajarla
      # en cada deploy son decenas de segundos.
      - name: Fecha (para la caché de Trivy)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de Trivy
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-

      - name: Escaneo de vulnerabilidades (Trivy)
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
        # Corta el pipeline con CRITICAL o HIGH que ya tengan versión corregida.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --scanners vuln --no-progress "$IMAGE" && exit 0
          # Lo más común: el gestor de paquetes de la imagen base (npm, pip, ...) trae sus
          # propias vulnerabilidades y en producción no se usa.
          echo "::error title=Imagen con vulnerabilidades::La imagen tiene vulnerabilidades CRITICAL/HIGH con arreglo (tabla de arriba). Si vienen del gestor de paquetes de la imagen base (npm, pip, setuptools, ...), quítalo de la etapa final del Dockerfile: en producción no se usa. Si vienen de tus dependencias, actualízalas."
          exit 1

      - name: Publicar la imagen de la app
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          docker push "$IMAGE:$TAG"
          if [ -n "$VERSION" ]; then docker tag "$IMAGE:$TAG" "$IMAGE:$VERSION" && docker push "$IMAGE:$VERSION"; fi

      - name: Imagen de migraciones (sin publicar)
        if: inputs.migrate
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.where.outputs.context }}
          file: ${{ steps.where.outputs.dockerfile }}
          target: migrate
          build-args: GIT_SHA=${{ github.sha }}
          secret-files: ${{ steps.bs.outputs.files }}
          load: true
          tags: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-migrate

      # Solo informa: corre una vez por deploy, en la red interna, y lleva el CLI de
      # Prisma con sus dependencias de build. Queda en el log, no bloquea.
      - name: Escaneo de migraciones (informativo)
        if: inputs.migrate
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}-migrate:${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --scanners vuln --no-progress "$IMAGE"

      - name: Publicar la imagen de migraciones
        if: inputs.migrate
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}-migrate:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

      # Trivy (en Docker, como root) deja su caché de root: se le devuelve al runner para que
      # actions/cache pueda guardarla al final del job.
      - name: Caché de Trivy legible
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy 2> /dev/null || true

  deploy:
    name: Desplegar en el VPS
    needs: [check, build]
    if: inputs.deploy && github.event_name == 'push'
    runs-on: ${{ inputs.runner }}
    permissions: {}
    concurrency:
      group: deploy-${{ inputs.image }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ inputs.deploy_host }}
      DEPLOY_PORT: ${{ inputs.deploy_port }}
      DEPLOY_USER: ${{ inputs.deploy_user }}
      DEPLOY_KNOWN_HOSTS: ${{ inputs.deploy_known_hosts }}
    steps:
      # Sin destino o sin llave de host verificada, no se intenta conectar a nada.
      - name: Destino del deploy configurado
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_KNOWN_HOSTS; do [ -n "${!v}" ] || missing+=("$v"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan variables de Actions en el repo de la app: ${missing[*]} (las fija 'andamio app create', o ansible-playbook apps.yml)"
            exit 1
          fi

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets[inputs.deploy_key] || fromJSON(secrets.ANDAMIO_SECRETS || '{}')[inputs.deploy_key] }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (sin caída, con migraciones)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        # Si falla, el ❌ y las pistas 💡 del servidor van arriba de la corrida (anotaciones),
        # como en Railway o Vercel: no hace falta buscarlas en el log.
        run: |
          VERSION="${VERSION:-${TAG::7}}"
          set +e
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$TAG $VERSION" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            title=$(grep -m1 '^❌' "$RUNNER_TEMP/deploy.log" | sed 's/^❌ *//')
            echo "::error title=Deploy::${title:-the deploy failed (rc=$rc), see the log of this step}"
            grep '^💡' "$RUNNER_TEMP/deploy.log" | sed 's/^💡 *//' | while IFS= read -r hint; do
              echo "::warning title=💡::$hint"
            done
          fi
          exit "$rc"
