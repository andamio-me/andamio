- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# En caliente, sin reiniciar Redis. REDISCLI_AUTH (usuario admin) ya está en el contenedor.
- name: Recargar usuarios de Redis
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command: docker exec redis redis-cli ACL LOAD
  changed_when: true

- name: Reiniciar bot de Telegram
  when: homelab_telegram | bool
  ansible.builtin.systemd_service:
    name: homelab-telegram-bot.service
    state: restarted

- name: Reiniciar Seafile
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command: docker restart seafile
  changed_when: true
