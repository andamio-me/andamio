# Un stack (no app) con su base en el Postgres compartido: crea usuario y base si
# faltan y después lo levanta. Incluido por main.yml (homelab_db_stack).

- name: "{{ homelab_db_stack.stack }}: contraseña de la base"
  ansible.builtin.set_fact:
    homelab_db_password: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/../' ~ homelab_db_stack.stack ~ '/secrets.sops.env',
                input_type='dotenv', output_type='dotenv')
         | regex_search('^POSTGRES_PASSWORD=([A-Za-z0-9]+)$', '\1', multiline=True) | default([], true) | first | default('') }}
  no_log: true

- name: "{{ homelab_db_stack.stack }}: POSTGRES_PASSWORD válida"
  ansible.builtin.assert:
    that: homelab_db_password | length >= 16
    fail_msg: "{{ homelab_db_stack.stack }}/secrets.sops.env necesita POSTGRES_PASSWORD alfanumérica"
    quiet: true

- name: "{{ homelab_db_stack.stack }}: ¿existen el usuario y la base?"
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - postgres
      - sh
      - -c
      - >-
        psql -U "$POSTGRES_USER" -d postgres -tA -c
        "SELECT (SELECT count(*) FROM pg_roles WHERE rolname = '{{ homelab_db_stack.db }}')
        || ',' || (SELECT count(*) FROM pg_database WHERE datname = '{{ homelab_db_stack.db }}')"
  register: homelab_db_state
  changed_when: false
  check_mode: false

- name: "{{ homelab_db_stack.stack }}: crear usuario y base"
  when: homelab_db_state.stdout != '1,1'
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command:
    argv: [docker, exec, -i, postgres, sh, -c, 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d postgres']
    stdin: |
      {% if homelab_db_state.stdout.split(',')[0] == '0' %}
      CREATE ROLE "{{ homelab_db_stack.db }}" LOGIN PASSWORD '{{ homelab_db_password }}';
      {% endif %}
      {% if homelab_db_state.stdout.split(',')[1] == '0' %}
      CREATE DATABASE "{{ homelab_db_stack.db }}" OWNER "{{ homelab_db_stack.db }}";
      REVOKE ALL ON DATABASE "{{ homelab_db_stack.db }}" FROM PUBLIC;
      {% endif %}
  changed_when: true
  no_log: true

- name: "{{ homelab_db_stack.stack }}: levantado"
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ homelab_infra }}/{{ homelab_db_stack.stack }}"
  register: homelab_db_stack_up
  changed_when: homelab_db_stack_up.stderr is search('Creat|Recreat|Start')
