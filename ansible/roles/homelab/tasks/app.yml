# Una app de la plataforma: .env, base de datos y arranque.
# Se incluye una vez por cada apps/<app>/app.yml (homelab_app_name).

- name: "{{ homelab_app_name }}: definición y secretos"
  ansible.builtin.set_fact:
    homelab_app: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../apps/' ~ homelab_app_name ~ '/app.yml') | from_yaml }}"
    homelab_app_dir: "{{ homelab_infra }}/apps/{{ homelab_app_name }}"
    homelab_app_secrets: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/../apps/' ~ homelab_app_name ~ '/secrets.sops.env',
                input_type='dotenv', output_type='dotenv') }}
  no_log: true

# TAG no está cifrado: lo maneja deploy-app.sh y aquí se conserva el actual.
- name: "{{ homelab_app_name }}: TAG actual"
  ansible.builtin.command: grep -m1 '^TAG=' {{ homelab_app_dir }}/.env
  register: homelab_app_tag
  changed_when: false
  failed_when: false
  check_mode: false

- name: "{{ homelab_app_name }}: .env (desde sops)"
  ansible.builtin.copy:
    # App nueva: "TAG=" vacío, que deploy-app.sh rellena en su primer deploy.
    content: "{{ ([homelab_app_secrets, homelab_app_tag.stdout or 'TAG='] | select | join('\n')) ~ '\n' }}"
    dest: "{{ homelab_app_dir }}/.env"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"
  no_log: true
  diff: false

# --- PostgreSQL (db: true): usuario y base desde DATABASE_URL ---

- name: "{{ homelab_app_name }}: base de datos"
  when: homelab_app.db | default(false)
  block:
    - name: "{{ homelab_app_name }}: datos de DATABASE_URL"
      ansible.builtin.set_fact:
        homelab_app_db: >-
          {{ homelab_app_secrets
             | regex_search('^DATABASE_URL=postgres(?:ql)?://([a-z0-9_]+):([A-Za-z0-9]+)@[^/]+/([a-z0-9_]+)$',
                            '\1', '\2', '\3', multiline=True) | default([], true) }}
      no_log: true

    - name: "{{ homelab_app_name }}: DATABASE_URL válida"
      ansible.builtin.assert:
        that: homelab_app_db | length == 3
        fail_msg: >-
          apps/{{ homelab_app_name }}/secrets.sops.env necesita
          DATABASE_URL=postgres://<usuario>:<clave alfanumérica>@postgres:5432/<base>
          (ansible-playbook apps.yml la genera).
        quiet: true

    - name: "{{ homelab_app_name }}: ¿existen el usuario y la base?"
      become: true
      become_user: "{{ homelab_user }}"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - postgres
          - sh
          - -c
          - >-
            psql -U "$POSTGRES_USER" -d postgres -tA -c
            "SELECT (SELECT count(*) FROM pg_roles WHERE rolname = '{{ homelab_app_db[0] }}')
            || ',' || (SELECT count(*) FROM pg_database WHERE datname = '{{ homelab_app_db[2] }}')"
      register: homelab_app_db_state
      changed_when: false
      check_mode: false

    - name: "{{ homelab_app_name }}: crear usuario y base"
      when: homelab_app_db_state.stdout != '1,1'
      become: true
      become_user: "{{ homelab_user }}"
      ansible.builtin.command:
        argv: [docker, exec, -i, postgres, sh, -c, 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d postgres']
        stdin: |
          {% if homelab_app_db_state.stdout.split(',')[0] == '0' %}
          CREATE ROLE "{{ homelab_app_db[0] }}" LOGIN PASSWORD '{{ homelab_app_db[1] }}';
          {% endif %}
          {% if homelab_app_db_state.stdout.split(',')[1] == '0' %}
          CREATE DATABASE "{{ homelab_app_db[2] }}" OWNER "{{ homelab_app_db[0] }}";
          REVOKE ALL ON DATABASE "{{ homelab_app_db[2] }}" FROM PUBLIC;
          {% endif %}
      changed_when: true
      no_log: true

# --- Arranque ---
# Una app que nunca se desplegó no tiene TAG: la levanta su primer deploy.

- name: "{{ homelab_app_name }}: levantada"
  when: homelab_app_tag.stdout | length > 4 and not (homelab_app.stopped | default(false))
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ homelab_app_dir }}"
  register: homelab_app_up
  changed_when: homelab_app_up.stderr is search('Creat|Recreat|Start')

# andamio app stop: contenedores detenidos (no borrados); datos, base, secretos y dominio
# intactos. deploy-app.sh tampoco la despliega mientras siga así.
- name: "{{ homelab_app_name }}: detenida (stopped: true en app.yml)"
  when: homelab_app.stopped | default(false)
  become: true
  become_user: "{{ homelab_user }}"
  ansible.builtin.command: docker compose stop
  args:
    chdir: "{{ homelab_app_dir }}"
  register: homelab_app_stop
  changed_when: homelab_app_stop.stderr is search('Stopped')
