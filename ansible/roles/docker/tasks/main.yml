# Docker de los repos de Ubuntu (docker.io): se actualiza con unattended-upgrades
# como el resto del sistema, sin repos ni llaves de terceros.

- name: Docker y Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present

# Seguro por defecto, no por convención:
#   ip 127.0.0.1: un "ports: 5432:5432" queda solo local (Docker se salta UFW); lo público
#     va por Traefik, que publica 80/443 en 0.0.0.0 y [::] de forma explícita.
#   no-new-privileges: ningún proceso de un contenedor gana privilegios con binarios setuid
#     (sudo, su). Un contenedor que de verdad lo necesite: security_opt: [no-new-privileges:false].
- name: Configuración del daemon (logs rotados, live-restore, puertos locales, sin escalar privilegios)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/docker/daemon.json"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  notify: Reiniciar Docker

- name: Docker activo al arrancar
  ansible.builtin.systemd_service:
    name: docker.service
    state: started
    enabled: true

# El grupo docker equivale a root: solo el usuario de operación.
- name: Usuario de operación en el grupo docker
  ansible.builtin.user:
    name: "{{ andamio_user }}"
    groups: docker
    append: true
