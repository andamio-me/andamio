# Archivos de configuración: se copian desde host/, la fuente de verdad.

- name: Zona horaria
  community.general.timezone:
    name: "{{ base_timezone }}"

# La contraseña de root que manda el proveedor deja de servir (también en su consola web):
# se administra con tu usuario y sudo. bootstrap.yml ya lo hace; aquí, para servidores viejos.
- name: Contraseña de root bloqueada
  ansible.builtin.user:
    name: root
    password_lock: true

- name: Paquetes base
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400   # las actualizaciones automáticas ya la refrescan cada día

# restic: el de Ubuntu es viejo (se instala el oficial abajo). snapd: un VPS no lo usa.
- name: Sin el restic de Ubuntu ni snapd
  ansible.builtin.apt:
    name: [restic, snapd]
    state: absent
    purge: true

- name: ¿Qué restic hay instalado?
  ansible.builtin.command: /usr/local/bin/restic version
  register: base_restic
  changed_when: false
  failed_when: false
  check_mode: false

- name: Instalar restic {{ base_restic_version }}
  when: ("restic " ~ base_restic_version ~ " ") not in base_restic.stdout
  vars:
    base_restic_file: restic_{{ base_restic_version }}_linux_amd64.bz2
    base_restic_url: https://github.com/restic/restic/releases/download/v{{ base_restic_version }}
  block:
    - name: Descargar restic (verificado contra SHA256SUMS)
      ansible.builtin.get_url:
        url: "{{ base_restic_url }}/{{ base_restic_file }}"
        checksum: "sha256:{{ base_restic_url }}/SHA256SUMS"
        dest: /tmp/{{ base_restic_file }}
        mode: "0644"

    - name: Descomprimir en /usr/local/bin
      ansible.builtin.shell: >
        bunzip2 -c /tmp/{{ base_restic_file }} > /usr/local/bin/restic.new &&
        chmod 755 /usr/local/bin/restic.new &&
        mv /usr/local/bin/restic.new /usr/local/bin/restic &&
        rm /tmp/{{ base_restic_file }}
      changed_when: true

- name: Actualizaciones automáticas
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/apt/52andamio-unattended"
    dest: /etc/apt/apt.conf.d/52andamio-unattended
    owner: root
    group: root
    mode: "0644"

- name: Parámetros del kernel
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/sysctl/99-andamio.conf"
    dest: /etc/sysctl.d/99-andamio.conf
    owner: root
    group: root
    mode: "0644"
  notify: Aplicar sysctl

- name: cloud-init desactivado tras el aprovisionamiento (ADR 0005)
  ansible.builtin.copy:
    content: ""
    dest: /etc/cloud/cloud-init.disabled
    owner: root
    group: root
    mode: "0644"
    force: false

# --- Swap ---

- name: ¿Existe /swapfile?
  ansible.builtin.stat:
    path: /swapfile
    get_checksum: false   # si no, lee los GB del swap para calcular su hash (~12 s)
    get_mime: false
  register: base_swapfile

- name: Crear swap de {{ base_swap_size }}
  when: not base_swapfile.stat.exists
  block:
    - name: Reservar /swapfile
      ansible.builtin.command: fallocate -l {{ base_swap_size }} /swapfile
      args:
        creates: /swapfile

    - name: Permisos de /swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Formatear y activar swap
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      changed_when: true

- name: Swap en fstab
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

# --- Servicios innecesarios ---

# Todos en una tarea (con systemd_service en un loop eran ~3 s por unidad). Solo las que
# están instaladas; enmascaradas: ni otro paquete ni una dependencia las vuelve a arrancar.
- name: Servicios innecesarios detenidos (enmascarados o desactivados)
  ansible.builtin.shell: |
    set -u
    off() {   # $1: mask o disable; el resto, las unidades
      how=$1; shift
      for u in "$@"; do
        [ -e "/usr/lib/systemd/system/$u" ] || continue
        state=$(systemctl is-enabled "$u" 2>/dev/null || true)
        if systemctl is-active -q "$u"; then systemctl stop "$u"; echo "detenido: $u"; fi
        if [ "$how" = mask ] && [ "$state" != masked ]; then
          systemctl mask "$u" >/dev/null 2>&1 && echo "enmascarado: $u"
        elif [ "$how" = disable ] && [ "$state" = enabled ]; then
          systemctl disable "$u" >/dev/null 2>&1 && echo "desactivado: $u"
        fi
      done
    }
    off mask {{ base_masked_units | join(' ') }}
    off disable {{ base_disabled_units | join(' ') }}
    exit 0
  register: base_units_off
  changed_when: base_units_off.stdout | length > 0
