# Orden pensado para no cortar el SSH en un servidor nuevo:
# primero se permite el puerto SSH, después se aplican las políticas y se activa.

- name: UFW instalado
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Permitir SSH antes de todo
  community.general.ufw:
    rule: allow
    port: "{{ andamio_ssh_port }}"
    proto: tcp

# bootstrap.yml deja el 22 abierto mientras se mueve SSH; aquí se cierra (la regla "deny 22"
# de abajo no alcanzaría: en UFW gana la primera regla que coincide).
- name: Sin el 22 temporal del bootstrap
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  when: andamio_ssh_port | string != "22"

# Reglas, políticas y registro en una tarea (con el módulo ufw en un loop eran ~2-3 s por
# regla). ufw no duplica una regla que ya existe ("Skipping"): cambio = "added" o "updated".
- name: Reglas, políticas por defecto y registro
  ansible.builtin.shell: |
    set -eu
    {% for r in firewall_rules %}
    ufw {{ r.rule }} proto {{ r.proto }} from {{ r.from | default('any') }} to {{ r.to | default('any') }}
    {{- ' ' }}port {{ r.port }}{% if r.comment is defined %} comment {{ r.comment | quote }}{% endif %}

    {% endfor %}
    status=$(ufw status verbose)
    for p in "deny (incoming)" "allow (outgoing)" "deny (routed)"; do
      case "$status" in
        *"$p"*) ;;
        *) set -- $p; dir=${2#(}; ufw default "$1" "${dir%)}"; echo "política: $p" ;;
      esac
    done
    case "$status" in
      *"Logging: on (low)"*) ;;
      *) ufw logging low; echo "registro: low" ;;
    esac
  register: firewall_applied
  changed_when: firewall_applied.stdout is search('Rule added|Rule updated|Rules updated|política|registro')

- name: UFW activo
  community.general.ufw:
    state: enabled
