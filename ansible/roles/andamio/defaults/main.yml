andamio_root: /srv/andamio

# HTTPS: "http" = un certificado de Let's Encrypt por app (HTTP-01), sin cuentas
# externas. "cloudflare" = un comodín por DNS-01 (necesita la zona en Cloudflare y
# CF_DNS_API_TOKEN en stacks/proxy/secrets.sops.env; no publica los nombres privados).
andamio_tls: http

# Dónde viven tus repos (bin/forge) y el registro de las imágenes de tus apps.
andamio_forge: github
andamio_registry: ghcr.io
andamio_infra: "{{ andamio_root }}/infra"

# Secretos del host cifrados en el repo (ansible/tools/cifrar-secretos-host.yml).
# Módulos que necesitan una cuenta en otro servicio: apagados hasta configurarlos.
# Backups: restic a cualquier destino (B2, S3, SFTP, disco), según RESTIC_REPOSITORY en
#   host/sops/restic-env.sops, con su contraseña en host/sops/restic-password.sops.
# Telegram: alertas, resumen diario y bot (host/sops/telegram-env.sops).
andamio_backups: false
andamio_telegram: false

andamio_sops_restic:
  - { src: host/sops/restic-env.sops, dest: /etc/restic/env, group: root, mode: "0600" }
  - { src: host/sops/restic-password.sops, dest: /etc/restic/password, group: root, mode: "0600" }
andamio_sops_telegram:
  - { src: host/sops/telegram-env.sops, dest: /etc/andamio/telegram.env, group: "{{ andamio_user }}", mode: "0640" }
andamio_sops_files: >-
  {{ (andamio_sops_restic if andamio_backups | bool else [])
     + (andamio_sops_telegram if andamio_telegram | bool else []) }}

# Secretos que no están en el repo: vuelven con restic restore.
andamio_host_secrets:
  - /home/{{ andamio_user }}/.ssh/id_ed25519_andamio   # deploy key de solo lectura del repo

# App cuya base de datos junta el registro de deploys de todas (tabla deployments) y que
# `andamio app destroy` no borra. Vacío: ninguna.
andamio_dashboard_app: ""

# Alertas sin Grafana (scripts/alerts.sh): contenedor caído o disco casi lleno. Llegan por
# Telegram (si está activado) y por ntfy si aquí hay una URL (la deja andamio alertas).
andamio_alerts_ntfy: ""

# Monitoreo: "minimo" (métricas, ~115 MiB), "completo" (+ logs, Grafana con alertas y
# Uptime Kuma, ~670 MiB) o "auto": completo si el servidor tiene 3 GB o más.
andamio_monitoring: auto

# Stacks de infraestructura, en orden de arranque: proxy primero (crea
# proxy_socket), datos antes que las apps.
andamio_stacks:
  - stacks/proxy
  - stacks/data
  - stacks/monitoring
  - stacks/uptime-kuma
  - stacks/whoami

# PostgreSQL y Redis compartidos por todas las apps (andamio servicios): memoria, CPU y ajustes.
# La memoria va como 512m o 2g. shared_buffers no se elige: es el 25 % de la memoria de
# PostgreSQL. La de Redis es para datos (maxmemory): el contenedor tiene 1.5× para el fork del AOF.
andamio_postgres_mem: 1g
andamio_postgres_cpus: 1.5
andamio_postgres_max_connections: 100
andamio_postgres_work_mem: 4MB
# El motor: redis (Redis 8), valkey (su continuación libre, BSD) o dragonfly (varios núcleos;
# guarda cada minuto, no cada segundo). Cambiarlo copia los datos (scripts/redis-engine.sh).
andamio_redis_engine: redis
andamio_redis_mem: 256m
andamio_redis_cpus: 0.5
andamio_redis_policy: noeviction   # BullMQ y otras colas la necesitan: con *-lru, Redis borraría trabajos

# MariaDB (apps con mysql: true): solo corre si alguna app la usa. innodb_buffer_pool (su caché)
# es el 40 % de su memoria.
andamio_mariadb_mem: 512m
andamio_mariadb_cpus: 1
andamio_mariadb_max_connections: 100
# ¿Alguna app la usa? (se lee de apps/*/app.yml en tu WSL, donde corre Ansible)
# (fileglob no sirve aquí: no acepta comodines en las carpetas, apps/*/app.yml daría siempre vacío.)
andamio_mariadb_needed: >-
  {{ lookup('ansible.builtin.pipe', "grep -lsE '^mysql:[[:space:]]*true' '" ~ playbook_dir ~ "'/../apps/*/app.yml || true")
     | length > 0 }}
andamio_mariadb_mem_mb: "{{ (andamio_mariadb_mem[:-1] | int) * (1024 if andamio_mariadb_mem[-1] | lower == 'g' else 1) }}"

andamio_postgres_mem_mb: "{{ (andamio_postgres_mem[:-1] | int) * (1024 if andamio_postgres_mem[-1] | lower == 'g' else 1) }}"
andamio_redis_mem_mb: "{{ (andamio_redis_mem[:-1] | int) * (1024 if andamio_redis_mem[-1] | lower == 'g' else 1) }}"
# Dragonfly pide 256 MB por hilo: tantos hilos como quepan en su memoria, sin pasar de su CPU.
andamio_dragonfly_threads: >-
  {{ [[(andamio_redis_mem_mb | int) // 256,
       ([andamio_redis_cpus | float, ansible_facts['processor_vcpus']] | min) | round(0, 'ceil') | int] | min, 1] | max }}
# Lo que stacks/data/compose.yaml lee de su .env (la CPU, nunca más que las del servidor).
andamio_data_env: |
  POSTGRES_CPUS={{ [andamio_postgres_cpus | float, ansible_facts['processor_vcpus']] | min }}
  POSTGRES_MEM={{ andamio_postgres_mem_mb }}m
  POSTGRES_SHARED_BUFFERS={{ (andamio_postgres_mem_mb | int) // 4 }}MB
  POSTGRES_MAX_CONNECTIONS={{ andamio_postgres_max_connections }}
  POSTGRES_WORK_MEM={{ andamio_postgres_work_mem }}
  REDIS_CPUS={{ [andamio_redis_cpus | float, ansible_facts['processor_vcpus']] | min }}
  REDIS_MAXMEMORY={{ andamio_redis_mem_mb }}mb
  REDIS_MEM={{ (andamio_redis_mem_mb | int) * 3 // 2 }}m
  REDIS_POLICY={{ andamio_redis_policy }}
  COMPOSE_PROFILES={{ ([andamio_redis_engine] + (['mariadb'] if andamio_mariadb_needed | bool else [])) | join(',') }}
  MARIADB_MEM={{ andamio_mariadb_mem_mb }}m
  MARIADB_BUFFER_POOL={{ (andamio_mariadb_mem_mb | int) * 2 // 5 }}M
  MARIADB_MAX_CONNECTIONS={{ andamio_mariadb_max_connections }}
  MARIADB_CPUS={{ [andamio_mariadb_cpus | float, ansible_facts['processor_vcpus']] | min }}
  DRAGONFLY_THREADS={{ andamio_dragonfly_threads }}
  DRAGONFLY_CACHE_MODE={{ 'true' if andamio_redis_policy.startswith('allkeys') else 'false' }}

# Stacks que necesitan su base en el Postgres compartido: se levantan después de
# crearla (ver tasks/main.yml). La contraseña sale de POSTGRES_PASSWORD de su secrets.sops.env.
andamio_db_stacks: []   # p. ej. { stack: stacks/x, db: x }

# /srv/andamio/archive (lo que guardan app destroy y app restore antes de tocar nada): pasados
# estos días se borra en el respaldo diario. Para entonces ya está en los respaldos mensuales.
andamio_archive_days: 90

# Stacks propios (los tuyos, además de los de la plataforma), declarados en tu config:
# - andamio_data_dirs: sus carpetas en /srv/andamio/data (entran al backup diario), p. ej.
#   { name: mi-stack, owner: "1000", mode: "0750" } (dueño root y modo 0700 si no se dicen).
# - andamio_stack_env: lo no secreto que su .env necesita, además de sus secretos de sops,
#   p. ej. { stacks/mi-stack: { MI_VARIABLE: valor } }.
# - andamio_extra_units: units de host/systemd/ que se instalan y activan (p. ej. un firewall).
# - Un backup coherente (pausar, dump): stacks/<stack>/backup-hook.sh, que scripts/backup.sh
#   corre antes de subir, con la carpeta de staging como argumento.
andamio_data_dirs: []
andamio_stack_env: {}
andamio_extra_units: []

# Límite de peticiones por IP en todas las apps públicas (Traefik): frena bots y abusos sin
# tocar a un usuario normal (una página pesada pide 50 a 100 recursos de golpe; el burst los cubre).
andamio_rate_average: 100   # por segundo, sostenido
andamio_rate_burst: 300     # de golpe

# Apps: cada carpeta apps/<app>/ con un app.yml (se buscan en tasks/main.yml y
# se levantan después de los stacks).

# Units: la salud de contenedores siempre; backup y Telegram si están activados.
# DNS que wg-add-client pone a los clientes nuevos de la VPN (p. ej. 10.8.0.1, un DNS propio
# en la VPN). Vacío: el de la red del cliente.
andamio_vpn_dns: ""
andamio_units: >-
  {{ ['andamio-container-health.service', 'andamio-container-health.timer']
     + (['andamio-backup.service', 'andamio-backup.timer'] if andamio_backups | bool else [])
     + (['andamio-daily-summary.service', 'andamio-daily-summary.timer',
         'andamio-telegram-bot.service'] if andamio_telegram | bool else [])
     + andamio_extra_units }}
andamio_enabled_units: >-
  {{ ['andamio-container-health.timer']
     + (['andamio-backup.timer'] if andamio_backups | bool else [])
     + (['andamio-daily-summary.timer', 'andamio-telegram-bot.service'] if andamio_telegram | bool else [])
     + andamio_extra_units }}
# Zona horaria de las tareas programadas de las apps (cron: en app.yml). La pone
# `andamio app cron add` la primera vez (la de tu máquina); el servidor sigue en UTC.
andamio_timezone: UTC
