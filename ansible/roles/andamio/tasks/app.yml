# Una app de la plataforma: .env, base de datos y arranque.
# Se incluye una vez por cada apps/<app>/app.yml (andamio_app_name).

- name: "{{ andamio_app_name }}: definición y secretos"
  ansible.builtin.set_fact:
    andamio_app: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../apps/' ~ andamio_app_name ~ '/app.yml') | from_yaml }}"
    andamio_app_dir: "{{ andamio_infra }}/apps/{{ andamio_app_name }}"
    andamio_app_secrets: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/../apps/' ~ andamio_app_name ~ '/secrets.sops.env',
                input_type='dotenv', output_type='dotenv') }}
  no_log: true

# TAG no está cifrado: lo maneja deploy-app.sh y aquí se conserva el actual.
- name: "{{ andamio_app_name }}: TAG actual"
  ansible.builtin.command: grep -m1 '^TAG=' {{ andamio_app_dir }}/.env
  register: andamio_app_tag
  changed_when: false
  failed_when: false
  check_mode: false

- name: "{{ andamio_app_name }}: .env (desde sops)"
  ansible.builtin.copy:
    # App nueva: "TAG=" vacío, que deploy-app.sh rellena en su primer deploy.
    content: "{{ ([andamio_app_secrets, andamio_app_tag.stdout or 'TAG='] | select | join('\n')) ~ '\n' }}"
    dest: "{{ andamio_app_dir }}/.env"
    owner: "{{ andamio_user }}"
    group: "{{ andamio_user }}"
    mode: "0600"
  no_log: true
  diff: false

# --- PostgreSQL (db: true): usuario y base desde DATABASE_URL ---

- name: "{{ andamio_app_name }}: base de datos"
  when: andamio_app.db | default(false)
  block:
    - name: "{{ andamio_app_name }}: datos de DATABASE_URL"
      ansible.builtin.set_fact:
        andamio_app_db: >-
          {{ andamio_app_secrets
             | regex_search('^DATABASE_URL=postgres(?:ql)?://([a-z0-9_]+):([A-Za-z0-9]+)@[^/]+/([a-z0-9_]+)$',
                            '\1', '\2', '\3', multiline=True) | default([], true) }}
      no_log: true

    - name: "{{ andamio_app_name }}: DATABASE_URL válida"
      ansible.builtin.assert:
        that: andamio_app_db | length == 3
        fail_msg: >-
          apps/{{ andamio_app_name }}/secrets.sops.env necesita
          DATABASE_URL=postgres://<usuario>:<clave alfanumérica>@postgres:5432/<base>
          (ansible-playbook apps.yml la genera).
        quiet: true

    - name: "{{ andamio_app_name }}: ¿existen el usuario y la base?"
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - postgres
          - sh
          - -c
          - >-
            psql -U "$POSTGRES_USER" -d postgres -tA -c
            "SELECT (SELECT count(*) FROM pg_roles WHERE rolname = '{{ andamio_app_db[0] }}')
            || ',' || (SELECT count(*) FROM pg_database WHERE datname = '{{ andamio_app_db[2] }}')"
      register: andamio_app_db_state
      changed_when: false
      check_mode: false

    - name: "{{ andamio_app_name }}: crear usuario y base"
      when: andamio_app_db_state.stdout != '1,1'
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv: [docker, exec, -i, postgres, sh, -c, 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d postgres']
        stdin: |
          {% if andamio_app_db_state.stdout.split(',')[0] == '0' %}
          CREATE ROLE "{{ andamio_app_db[0] }}" LOGIN PASSWORD '{{ andamio_app_db[1] }}';
          {% endif %}
          {% if andamio_app_db_state.stdout.split(',')[1] == '0' %}
          CREATE DATABASE "{{ andamio_app_db[2] }}" OWNER "{{ andamio_app_db[0] }}";
          REVOKE ALL ON DATABASE "{{ andamio_app_db[2] }}" FROM PUBLIC;
          {% endif %}
      changed_when: true
      no_log: true

    # Que una app no acapare la base: cuántas conexiones puede abrir (db_connections; sin él, las
    # que haya) y cuánto puede durar una consulta (db_timeout: 30s, 2min; sin él, sin límite).
    - name: "{{ andamio_app_name }}: límites de su base"
      become: true
      become_user: "{{ andamio_user }}"
      vars:
        andamio_db_limit: "{{ andamio_app.db_connections | default(0) | int or -1 }}"
        andamio_db_timeout: "{{ andamio_app.db_timeout | default('0') | string }}"
      ansible.builtin.command:
        argv: [docker, exec, -i, postgres, sh, -c, 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d postgres']
        stdin: |
          DO $$
          DECLARE lim int; tmo text;
          BEGIN
            SELECT rolconnlimit INTO lim FROM pg_roles WHERE rolname = '{{ andamio_app_db[0] }}';
            SELECT split_part(c, '=', 2) INTO tmo
              FROM pg_db_role_setting s JOIN pg_roles r ON r.oid = s.setrole, unnest(s.setconfig) c
              WHERE r.rolname = '{{ andamio_app_db[0] }}' AND s.setdatabase = 0 AND c LIKE 'statement_timeout=%';
            IF lim IS DISTINCT FROM {{ andamio_db_limit }} THEN
              EXECUTE format('ALTER ROLE %I CONNECTION LIMIT {{ andamio_db_limit }}', '{{ andamio_app_db[0] }}');
              RAISE NOTICE 'andamio: cambió';
            END IF;
            IF coalesce(tmo, '0') IS DISTINCT FROM '{{ andamio_db_timeout }}' THEN
              {% if andamio_db_timeout == '0' %}
              EXECUTE format('ALTER ROLE %I RESET statement_timeout', '{{ andamio_app_db[0] }}');
              {% else %}
              EXECUTE format('ALTER ROLE %I SET statement_timeout = %L', '{{ andamio_app_db[0] }}', '{{ andamio_db_timeout }}');
              {% endif %}
              RAISE NOTICE 'andamio: cambió';
            END IF;
          END $$;
      register: andamio_app_db_limits
      changed_when: "'andamio: cambió' in andamio_app_db_limits.stderr"

# --- MariaDB (mysql: true): usuario y base desde MYSQL_URL ---

- name: "{{ andamio_app_name }}: MariaDB"
  when: andamio_app.mysql | default(false)
  block:
    - name: "{{ andamio_app_name }}: datos de MYSQL_URL"
      ansible.builtin.set_fact:
        andamio_app_mysql: >-
          {{ andamio_app_secrets
             | regex_search('^MYSQL_URL=mysql://([a-z0-9_]+):([A-Za-z0-9]+)@[^/]+/([a-z0-9_]+)$',
                            '\1', '\2', '\3', multiline=True) | default([], true) }}
      no_log: true

    - name: "{{ andamio_app_name }}: MYSQL_URL válida"
      ansible.builtin.assert:
        that: andamio_app_mysql | length == 3
        fail_msg: >-
          apps/{{ andamio_app_name }}/secrets.sops.env necesita
          MYSQL_URL=mysql://<usuario>:<clave alfanumérica>@mariadb:3306/<base>
          (ansible-playbook apps.yml la genera).
        quiet: true

    # La primera app que la usa la enciende: el .env de stacks/data ya trae el profile mariadb.
    - name: "{{ andamio_app_name }}: memoria y CPU del servidor (para el .env de stacks/data)"
      when: ansible_facts['processor_vcpus'] is not defined
      ansible.builtin.setup:
        gather_subset: [hardware]

    - name: "{{ andamio_app_name }}: .env de stacks/data"
      ansible.builtin.include_tasks: stack-env.yml
      vars:
        andamio_stack: stacks/data
        andamio_monitoring_level: ""

    - name: "{{ andamio_app_name }}: MariaDB arriba"
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command: docker compose up -d --wait mariadb
      args:
        chdir: "{{ andamio_infra }}/stacks/data"
      register: andamio_mariadb_up
      changed_when: andamio_mariadb_up.stderr is search('Creat|Recreat|Start')

    - name: "{{ andamio_app_name }}: ¿existen el usuario y la base en MariaDB?"
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mariadb
          - sh
          - -c
          - >-
            MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -N -B -e
            "SELECT CONCAT((SELECT COUNT(*) FROM mysql.user WHERE user = '{{ andamio_app_mysql[0] }}'), ',',
            (SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = '{{ andamio_app_mysql[2] }}'))"
      register: andamio_app_mysql_state
      changed_when: false
      check_mode: false

    # Su base y un usuario que solo puede usar esa base (nada global: ni FILE, ni otras bases).
    - name: "{{ andamio_app_name }}: crear usuario y base en MariaDB"
      when: andamio_app_mysql_state.stdout != '1,1'
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv: [docker, exec, -i, mariadb, sh, -c, 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot']
        stdin: |
          CREATE DATABASE IF NOT EXISTS `{{ andamio_app_mysql[2] }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS '{{ andamio_app_mysql[0] }}'@'%' IDENTIFIED BY '{{ andamio_app_mysql[1] }}';
          GRANT ALL PRIVILEGES ON `{{ andamio_app_mysql[2] }}`.* TO '{{ andamio_app_mysql[0] }}'@'%';
      changed_when: true
      no_log: true

    # Los mismos límites que en PostgreSQL (db_connections, db_timeout en app.yml): conexiones a
    # la vez y cuánto puede durar una consulta (MAX_STATEMENT_TIME, en segundos). 0 = sin límite.
    - name: "{{ andamio_app_name }}: límites actuales en MariaDB"
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mariadb
          - sh
          - -c
          - >-
            MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -N -B -e
            "SELECT CONCAT(max_user_connections, ',', max_statement_time) FROM mysql.user
            WHERE user = '{{ andamio_app_mysql[0] }}' AND host = '%'"
      register: andamio_app_mysql_limits
      changed_when: false
      check_mode: false

    - name: "{{ andamio_app_name }}: límites de su base en MariaDB"
      vars:
        andamio_mysql_conn: "{{ andamio_app.db_connections | default(0) | int }}"
        andamio_mysql_tmo_raw: "{{ andamio_app.db_timeout | default('0') | string }}"
        andamio_mysql_tmo: >-
          {{ (andamio_mysql_tmo_raw[:-2] | float / 1000) if andamio_mysql_tmo_raw.endswith('ms')
             else (andamio_mysql_tmo_raw[:-3] | float * 60) if andamio_mysql_tmo_raw.endswith('min')
             else (andamio_mysql_tmo_raw[:-1] | float) if andamio_mysql_tmo_raw.endswith('s') else 0 }}
      when: >-
        (andamio_app_mysql_limits.stdout.split(',')[0] | int) != (andamio_mysql_conn | int)
        or (andamio_app_mysql_limits.stdout.split(',')[1] | default('0') | float) != (andamio_mysql_tmo | float)
      become: true
      become_user: "{{ andamio_user }}"
      ansible.builtin.command:
        argv: [docker, exec, -i, mariadb, sh, -c, 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot']
        stdin: >-
          ALTER USER '{{ andamio_app_mysql[0] }}'@'%' WITH MAX_USER_CONNECTIONS {{ andamio_mysql_conn }}
          MAX_STATEMENT_TIME {{ andamio_mysql_tmo | float }};
      changed_when: true

# --- Arranque ---
# Una app que nunca se desplegó no tiene TAG: la levanta su primer deploy.

# volumes: en app.yml: que existan y sean del usuario de su imagen (antes de arrancar).
- name: "{{ andamio_app_name }}: carpetas persistentes"
  when: (andamio_app.volumes | default([]) | length > 0) and andamio_app_tag.stdout | length > 4
  become: true
  become_user: "{{ andamio_user }}"
  ansible.builtin.command: "{{ andamio_infra }}/scripts/app-volumes.sh {{ andamio_app_name }}"
  register: andamio_app_volumes
  changed_when: "'✓' in andamio_app_volumes.stdout"

- name: "{{ andamio_app_name }}: levantada"
  when: andamio_app_tag.stdout | length > 4 and not (andamio_app.stopped | default(false))
  become: true
  become_user: "{{ andamio_user }}"
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ andamio_app_dir }}"
  register: andamio_app_up
  changed_when: andamio_app_up.stderr is search('Creat|Recreat|Start')

# andamio app stop: contenedores detenidos (no borrados); datos, base, secretos y dominio
# intactos. deploy-app.sh tampoco la despliega mientras siga así.
- name: "{{ andamio_app_name }}: detenida (stopped: true en app.yml)"
  when: andamio_app.stopped | default(false)
  become: true
  become_user: "{{ andamio_user }}"
  # Solo si algo corre: `compose stop` dice "Stopped" aunque ya estuviera apagada.
  ansible.builtin.shell: |
    if [ -n "$(docker compose ps -q --status running)" ]; then docker compose stop && echo detenida; fi
  args:
    chdir: "{{ andamio_app_dir }}"
  register: andamio_app_stop
  changed_when: "'detenida' in andamio_app_stop.stdout"

# --- Tareas programadas (cron: en app.yml) ---
- name: "{{ andamio_app_name }}: tareas programadas"
  ansible.builtin.include_tasks: app-cron.yml
