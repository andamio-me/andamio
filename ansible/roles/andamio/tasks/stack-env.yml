# El .env de los stacks (andamio_env_stacks): sus secretos vienen cifrados del repo
# (<stack>/secrets.sops.env) y se descifran en tu WSL con tu llave age; el servidor nunca tiene
# la llave. Al final, lo no secreto que necesita (group_vars/all.yml). Lo usan main.yml (todos
# los stacks), servicios.yml y app.yml (solo stacks/data, al cambiar PostgreSQL o Redis).
# Todos en una sola tarea (andamio_files): una ida y vuelta al servidor, no una por stack.

- name: PostgreSQL y Redis caben en la memoria del servidor
  when: "'stacks/data' in andamio_env_stacks"
  ansible.builtin.assert:
    that: >-
      (andamio_postgres_mem_mb | int) + (andamio_redis_mem_mb | int) * 3 // 2
      + ((andamio_mariadb_mem_mb | int) if andamio_mariadb_needed | bool else 0) <= ansible_facts['memtotal_mb'] * 0.7
    fail_msg: >-
      PostgreSQL ({{ andamio_postgres_mem }}), Redis ({{ andamio_redis_mem }}, más su margen)
      {{ 'y MariaDB (' ~ andamio_mariadb_mem ~ ')' if andamio_mariadb_needed | bool else '' }} pedirían más del 70 %
      de la memoria del servidor ({{ ansible_facts['memtotal_mb'] }} MB): las apps se quedarían sin espacio.
      Bájalo con andamio servicios.
    quiet: true

- name: .env de {{ andamio_env_stacks | length }} stack(s) (desde sops)
  andamio_files:
    files: "{{ lookup('template', 'stack-envs.json.j2') | from_json }}"
  no_log: true   # nunca mostrar secretos, ni en errores
  diff: false
