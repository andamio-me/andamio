# Trae los secretos del host a tu WSL, los cifra con sops y borra la copia en claro.
# Uso único (o cuando cambie alguno en el servidor):
#   ansible-playbook tools/cifrar-secretos-host.yml -K
# Se guardan como binarios: el descifrado reproduce el archivo byte a byte.
- name: Cifrar secretos del host
  hosts: homelab
  become: true
  gather_facts: false
  vars:
    secretos:
      - { src: /etc/restic/env, dest: host/sops/restic-env.sops }
      - { src: /etc/restic/password, dest: host/sops/restic-password.sops }
      - { src: /etc/homelab/telegram.env, dest: host/sops/telegram-env.sops }
    repo: "{{ playbook_dir }}/../.."
  tasks:
    - name: Carpeta temporal privada en tu WSL (0700)  # noqa: run-once[task] (estrategia lineal)
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.tempfile:
        state: directory
      register: tmp

    - name: Traer, cifrar y borrar la copia en claro
      block:
        - name: Traer cada archivo
          ansible.builtin.fetch:
            src: "{{ item.src }}"
            dest: "{{ tmp.path }}/{{ idx }}"
            flat: true
          loop: "{{ secretos }}"
          loop_control:
            index_var: idx
            label: "{{ item.src }}"

        - name: Cifrar con sops
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            sops encrypt --input-type binary --output-type json
            --filename-override {{ item.dest }} {{ tmp.path }}/{{ idx }}
            > {{ item.dest }}
          changed_when: true
          args:
            chdir: "{{ repo }}"
          loop: "{{ secretos }}"
          loop_control:
            index_var: idx
            label: "{{ item.dest }}"
      always:
        - name: Borrar la copia en claro  # noqa: run-once[task] (estrategia lineal)
          delegate_to: localhost
          become: false
          run_once: true
          ansible.builtin.shell: shred -u {{ tmp.path }}/* 2>/dev/null; rm -rf {{ tmp.path }}
          changed_when: true
