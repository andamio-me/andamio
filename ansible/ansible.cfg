[defaults]
inventory = inventory.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Espera de SSH y del prompt de sudo: 12 s (el defecto) se queda corto con el servidor ocupado.
timeout = 45

[ssh_connection]
# Reusa la conexión SSH entre tareas: mucho más rápido.
pipelining = true
