# Primer paso en un VPS NUEVO (Ubuntu 24.04, root con tu llave, SSH en el 22).
#   ansible-playbook bootstrap.yml -e ansible_user=root -e ansible_port=22
# Crea el usuario de operación y mueve SSH a su puerto (group_vars/all.yml). La conexión se corta al final: es lo esperado.
# Después todo va con site.yml (ver docs/runbooks/reconstruir-servidor.md).
- name: Bootstrap de un VPS nuevo
  hosts: servers
  gather_facts: false
  vars_prompt:
    - name: bootstrap_password
      prompt: Contraseña de sudo del usuario de operación (guárdala en el gestor)
      private: true
      encrypt: sha512_crypt
      confirm: true
      salt_size: 16
  tasks:
    # Mismo UID que el servidor original: los archivos que restaura restic
    # guardan el dueño por número.
    - name: Usuario de operación
      ansible.builtin.user:
        name: "{{ andamio_user }}"
        uid: "{{ andamio_uid }}"
        groups: sudo
        append: true
        shell: /bin/bash
        password: "{{ bootstrap_password }}"
        update_password: on_create

    - name: Llaves autorizadas
      ansible.posix.authorized_key:
        user: "{{ andamio_user }}"
        key: "{{ lookup('file', playbook_dir + '/../host/ssh/authorized_keys') }}"

    # Antes de cerrarle la puerta a todo lo demás: tu usuario nuevo tiene que entrar con su
    # llave (por el 22, que sigue abierto). Si no, el endurecimiento te dejaría afuera.
    - name: Tu usuario nuevo entra con su llave
      ansible.builtin.command: ssh -p 22 -o BatchMode=yes -o ConnectTimeout=15 {{ inventory_hostname }} true
      delegate_to: localhost
      become: false
      changed_when: false

    # Desde aquí, el VPS nunca queda con contraseñas, root ni puertos abiertos: el endurecimiento
    # de SSH y el firewall se aplican ya, no hasta site.yml (si site.yml fallaba o se corría
    # tarde, los bots tenían SSH con contraseña y sin firewall).
    - name: Endurecimiento de sshd (solo llave, sin root, solo tu usuario)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../host/ssh/00-andamio-hardening.conf.j2"
        dest: /etc/ssh/sshd_config.d/00-andamio-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s

    - name: Sin el archivo de cloud-init que activaba contraseñas
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        state: absent

    # La contraseña de root que manda el proveedor (por correo, en su panel) deja de servir,
    # también en la consola web. Para administrar: tu usuario con sudo.
    - name: Contraseña de root bloqueada
      ansible.builtin.user:
        name: root
        password_lock: true

    - name: UFW instalado
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    # El 22 queda abierto solo hasta site.yml (el rol firewall lo cierra): si algo falla
    # antes de mover el puerto, todavía se puede volver a entrar.
    - name: Firewall, SSH permitido (el puerto nuevo y, por ahora, el 22)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["{{ andamio_ssh_port }}", "22"]

    - name: Firewall, todo lo demás que entra se rechaza
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
        - { direction: routed, policy: deny }
      loop_control:
        label: "{{ item.direction }}: {{ item.policy }}"

    - name: Firewall activo
      community.general.ufw:
        state: enabled

    - name: Directorio del override de ssh.socket
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        mode: "0755"

    - name: SSH en el puerto {{ andamio_ssh_port }}
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../host/systemd/ssh.socket.d/override.conf.j2"
        dest: /etc/systemd/system/ssh.socket.d/override.conf
        mode: "0644"

    - name: Mover SSH al puerto nuevo (corta esta conexión)
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted
        daemon_reload: true
      async: 30
      poll: 0
