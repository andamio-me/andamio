# Llave de deploy de una app: si falta apps/<app>/deploy_key.pub, genera un par
# ed25519, sube la privada como secret DEPLOY_SSH_KEY del repo de la app (gh) y
# guarda solo la pública. La privada nunca queda en disco. Incluido por apps.yml.
# Además fija las variables de Actions DEPLOY_* (a dónde desplegar) en cada corrida.
# Rotar: borrar deploy_key.pub, correr apps.yml y luego ./hl aplicar homelab.

- name: "{{ app_name }}: definición"
  ansible.builtin.set_fact:
    app_def: "{{ lookup('ansible.builtin.file', repo ~ '/apps/' ~ app_name ~ '/app.yml') | from_yaml }}"

- name: "{{ app_name }}: ¿tiene llave de deploy?"
  ansible.builtin.stat:
    path: "{{ repo }}/apps/{{ app_name }}/deploy_key.pub"
  register: app_key

- name: "{{ app_name }}: crear llave de deploy"
  when: not app_key.stat.exists
  vars:
    app_repo: "{{ app_def.repo | default(homelab_github_owner ~ '/' ~ app_def.name) }}"
  block:
    - name: "{{ app_name }}: ¿existe el repo {{ app_repo }}?"
      ansible.builtin.command: gh repo view {{ app_repo }} --json name
      register: app_repo_check
      changed_when: false
      failed_when: false

    - name: "{{ app_name }}: sin repo todavía"
      when: app_repo_check.rc != 0
      ansible.builtin.debug:
        msg: "No existe {{ app_repo }} (o gh no está autenticado): la llave se crea cuando exista."

    - name: "{{ app_name }}: generar y subir la llave"
      when: app_repo_check.rc == 0
      block:
        - name: "{{ app_name }}: carpeta temporal privada"
          ansible.builtin.tempfile:
            state: directory
          register: app_key_tmp

        - name: "{{ app_name }}: par de llaves ed25519"
          ansible.builtin.command: >
            ssh-keygen -q -t ed25519 -N '' -C ci-deploy-{{ app_name }}
            -f {{ app_key_tmp.path }}/key
          changed_when: true

        - name: "{{ app_name }}: privada -> secret DEPLOY_SSH_KEY de {{ app_repo }}"
          ansible.builtin.shell: gh secret set DEPLOY_SSH_KEY --repo {{ app_repo }} < {{ app_key_tmp.path }}/key
          changed_when: true

        - name: "{{ app_name }}: guardar solo la pública"
          ansible.builtin.copy:
            src: "{{ app_key_tmp.path }}/key.pub"
            dest: "{{ repo }}/apps/{{ app_name }}/deploy_key.pub"
            mode: "0644"
      always:
        - name: "{{ app_name }}: borrar la privada"
          when: app_key_tmp.path is defined
          ansible.builtin.shell: shred -u {{ app_key_tmp.path }}/key 2>/dev/null; rm -rf {{ app_key_tmp.path }}
          changed_when: false

# A dónde desplegar: variables de Actions del repo de la app (no son secretas, pero no
# van en el código del workflow público). Solo se escriben si faltan o cambiaron.
- name: "{{ app_name }}: variables de deploy del repo"
  vars:
    app_repo: "{{ app_def.repo | default(homelab_github_owner ~ '/' ~ app_def.name) }}"
    app_deploy_vars:
      DEPLOY_HOST: "{{ homelab_server_ip }}"
      DEPLOY_PORT: "{{ homelab_ssh_port }}"
      DEPLOY_USER: "{{ homelab_user }}"
      DEPLOY_KNOWN_HOSTS: "[{{ homelab_server_ip }}]:{{ homelab_ssh_port }} {{ homelab_ssh_host_key }}"
  block:
    - name: "{{ app_name }}: variables actuales de {{ app_repo }}"
      ansible.builtin.command: gh variable list --repo {{ app_repo }} --json name,value
      register: app_vars_now
      changed_when: false
      failed_when: false

    - name: "{{ app_name }}: fijar las que faltan o cambiaron"
      when:
        - app_vars_now.rc == 0
        - (app_vars_now.stdout | from_json | items2dict(key_name='name', value_name='value')).get(item.key) != item.value
      ansible.builtin.command:
        argv: [gh, variable, set, "{{ item.key }}", --repo, "{{ app_repo }}", --body, "{{ item.value }}"]
      loop: "{{ app_deploy_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
