# La clave de root de MariaDB en stacks/data/secrets.sops.env, la primera vez que una app la usa
# (mysql: true). Se genera aquí (alfanumérica, 40 caracteres) y solo se escribe cifrada. Incluido
# por apps.yml. Nunca cambia una que ya está.

- name: "stacks/data: secretos actuales"
  ansible.builtin.set_fact:
    data_secrets: >-
      {{ lookup('community.sops.sops', repo ~ '/stacks/data/secrets.sops.env',
                input_type='dotenv', output_type='dotenv') }}
  no_log: true

- name: "stacks/data: clave de root de MariaDB"
  when: data_secrets is not search('(?m)^MARIADB_ROOT_PASSWORD=')
  vars:
    root_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=40) }}"
  block:
    - name: "stacks/data: archivo temporal privado"
      ansible.builtin.tempfile:
        state: file
      register: data_tmp

    - name: "stacks/data: secretos en claro (temporal, 0600)"
      ansible.builtin.copy:
        content: "{{ data_secrets ~ '\nMARIADB_ROOT_PASSWORD=' ~ root_password ~ '\n' }}"
        dest: "{{ data_tmp.path }}"
        mode: "0600"
      no_log: true
      diff: false

    - name: "stacks/data: cifrar con sops"
      ansible.builtin.shell: >
        sops encrypt --input-type dotenv --output-type dotenv
        --filename-override stacks/data/secrets.sops.env {{ data_tmp.path }}
        > stacks/data/secrets.sops.env.tmp && mv stacks/data/secrets.sops.env.tmp stacks/data/secrets.sops.env
      args:
        chdir: "{{ repo }}"
      changed_when: true
  always:
    - name: "stacks/data: borrar el temporal"
      when: data_tmp.path is defined
      ansible.builtin.shell: shred -u {{ data_tmp.path }} 2>/dev/null || rm -f {{ data_tmp.path }}
      changed_when: false
