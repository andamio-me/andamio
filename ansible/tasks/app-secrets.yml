# Completa apps/<app>/secrets.sops.env con lo que la app necesita y aún no tiene.
# Nunca cambia un valor existente. Las claves nuevas se generan aquí (alfanuméricas,
# 32 caracteres) y solo se escriben cifradas. Incluido por apps.yml (app_name).

- name: "{{ app_name }}: definición y secretos actuales"
  ansible.builtin.set_fact:
    app_def: "{{ lookup('ansible.builtin.file', repo ~ '/apps/' ~ app_name ~ '/app.yml') | from_yaml }}"
    app_secrets_file: apps/{{ app_name }}/secrets.sops.env
    app_secrets: >-
      {{ lookup('community.sops.sops', repo ~ '/apps/' ~ app_name ~ '/secrets.sops.env',
                input_type='dotenv', output_type='dotenv', empty_on_not_exist=true) }}
  no_log: true

- name: "{{ app_name }}: qué falta"
  vars:
    db_name: "{{ app_def.db_name | default(app_def.name | replace('-', '_')) }}"
    password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
    redis_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
    # MariaDB (mysql: true): MYSQL_URL y, si la app no tiene también PostgreSQL, las DB_* de Laravel.
    mysql_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
  ansible.builtin.set_fact:
    app_missing: >-
      {{ ([] if app_secrets is search('(?m)^DOMAIN=') else ['DOMAIN=' ~ apps_domain])
         + ([] if not (app_def.db | default(false)) or app_secrets is search('(?m)^DATABASE_URL=')
            else ['DATABASE_URL=postgres://' ~ db_name ~ ':' ~ password ~ '@postgres:5432/' ~ db_name])
         + ([] if not (app_def.redis | default(false)) or app_secrets is search('(?m)^REDIS_URL=')
            else ['REDIS_URL=redis://' ~ app_def.name ~ ':' ~ redis_password ~ '@redis:6379/0'])
         + ([] if not (app_def.mysql | default(false)) or app_secrets is search('(?m)^MYSQL_URL=')
            else ['MYSQL_URL=mysql://' ~ db_name ~ ':' ~ mysql_password ~ '@mariadb:3306/' ~ db_name]
                 + ([] if (app_def.db | default(false)) else
                    ['DB_CONNECTION=mysql', 'DB_HOST=mariadb', 'DB_PORT=3306', 'DB_DATABASE=' ~ db_name,
                     'DB_USERNAME=' ~ db_name, 'DB_PASSWORD=' ~ mysql_password])) }}
  no_log: true

- name: "{{ app_name }}: agregar lo que falta (cifrado)"
  when: app_missing | length > 0
  block:
    - name: "{{ app_name }}: archivo temporal privado"
      ansible.builtin.tempfile:
        state: file
      register: app_tmp

    - name: "{{ app_name }}: secretos en claro (temporal, 0600)"
      ansible.builtin.copy:
        content: "{{ ([app_secrets] + app_missing) | select | join('\n') ~ '\n' }}"
        dest: "{{ app_tmp.path }}"
        mode: "0600"
      no_log: true
      diff: false

    - name: "{{ app_name }}: cifrar con sops"
      ansible.builtin.shell: >
        sops encrypt --input-type dotenv --output-type dotenv
        --filename-override {{ app_secrets_file }} {{ app_tmp.path }}
        > {{ app_secrets_file }}.tmp && mv {{ app_secrets_file }}.tmp {{ app_secrets_file }}
      args:
        chdir: "{{ repo }}"
      changed_when: true

    - name: "{{ app_name }}: agregado"
      ansible.builtin.debug:
        msg: "Nuevas en {{ app_secrets_file }}: {{ app_missing | map('regex_replace', '=.*', '') | join(', ') }}"
  always:
    - name: "{{ app_name }}: borrar el temporal"
      when: app_tmp.path is defined
      ansible.builtin.shell: shred -u {{ app_tmp.path }} 2>/dev/null || rm -f {{ app_tmp.path }}
      changed_when: false
