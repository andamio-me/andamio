# Reconstruye el servidor de andamio.
#   Revisar sin tocar nada:  ansible-playbook site.yml -K --check --diff
#   Aplicar:                 ansible-playbook site.yml -K
#   Un solo rol:             ... --tags firewall
- name: Servidor de andamio
  hosts: servers
  become: true
  gather_subset: [hardware]   # memoria y CPUs; sin red ni el resto (más rápido)
  roles:
    - { role: base, tags: base }
    - { role: ssh, tags: ssh }
    - { role: firewall, tags: firewall }
    - { role: fail2ban, tags: fail2ban }
    - { role: docker, tags: docker }
    - { role: wireguard, tags: wireguard }
    - { role: andamio, tags: andamio }
